/* Suki’s Gemini — refined personal theme */
:root{--bg:#141219;--sidebar:#19161f;--panel:#211d28;--panel2:#2b2633;--surface:#24202c;--line:#3d3548;--blue:#c5c5ff;--accent:#d0a9ff;--purple:#efb5ee;--radius:24px}
.app{background:radial-gradient(ellipse at 72% 38%,#29233e 0%,#1b1724 36%,#141219 73%)}
.sidebar{background:rgba(25,22,31,.97);border-right-color:#cda9ff0b}
.brand{gap:11px;padding-bottom:22px;min-height:61px}
.brand-symbol{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(145deg,#3c3156,#272437);border:1px solid #d7b4ff26;box-shadow:0 5px 22px #9a6dff18,inset 0 1px #ffffff10}
.brand-symbol .spark{font-size:23px;filter:drop-shadow(0 0 9px #bca5ff50)}
.brand-copy{display:flex;flex-direction:column;gap:1px;min-width:0;white-space:normal;line-height:1.25}
.brand-copy strong{font-size:15px;letter-spacing:-.3px;color:#f2edf9;font-weight:680}
.brand-copy small{font-size:10px;letter-spacing:.01em;color:#938ba4;font-weight:450}
.newchat{background:linear-gradient(115deg,#332c42,#292531);border:1px solid #d5b4ff15;border-radius:14px}
.newchat>span:first-child{font-size:17px;color:#d9b9ff}
.navbtn span:first-child{color:#c7a6ef}
.sectionlabel{color:#9488a5}
.chatitem.active{background:#393143;color:#f6edff;box-shadow:inset 2px 0 #c8a3ff}
.avatar{background:linear-gradient(135deg,#a98be8,#775ec1);box-shadow:0 0 0 2px #d9bdff17,0 4px 15px #9e7aff1a}
.topbar{border-bottom-color:#ffffff08}
.topbar-context strong{color:#f2ecfb;font-size:13px;letter-spacing:-.15px}
.status-dot.ready{background:#8cdbb7;box-shadow:0 0 11px #8cdbb755}
.pill{background:#292430;border-color:#ffffff0a}
.pill.primary{background:linear-gradient(135deg,#d2b5ff,#b9b4ff);color:#241a35;box-shadow:0 4px 18px #ab86f21a}
.workspace{scrollbar-color:#4d405e transparent}
.welcome{max-width:900px;padding-bottom:30px}
.welcome-eyebrow{color:#c5a9ed;font-size:10px;letter-spacing:.19em;gap:10px}
.welcome-eyebrow .spark{font-size:18px}
.welcome h1{font-size:clamp(36px,4.3vw,55px);line-height:1.13;letter-spacing:-2px;background:none;color:#f5f0fc;font-weight:560;margin-bottom:14px}
.welcome h1 #welcomeName{background:linear-gradient(95deg,#c6b6ff,#efb5ee 82%);color:transparent;background-clip:text;-webkit-background-clip:text}
.headline-second{background:linear-gradient(100deg,#c4bcff 0%,#e0c4f6 48%,#f0e7fb 95%);color:transparent;background-clip:text;-webkit-background-clip:text}
.welcome-subtitle{color:#aaa2b7;max-width:550px;font-size:14px;margin-bottom:28px}
.suggestions{gap:13px;margin-top:27px}
.suggestion{position:relative;overflow:hidden;min-height:134px;border-radius:19px;padding:17px;border-color:#dfc9ff10;background:linear-gradient(145deg,#292431e8,#201c27f2);box-shadow:0 12px 30px #00000012,inset 0 1px #ffffff04}
.suggestion:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0%,#bb9df00c,transparent 50%);pointer-events:none}
.suggestion:hover{border-color:#c8a6ff4a;background:linear-gradient(145deg,#332b40,#25202e);box-shadow:0 12px 35px #0002,0 0 0 1px #c8a6ff09}
.suggestion-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:#bca1ff13;border:1px solid #c9adff15;color:#d8beff;font-size:18px}
.suggestion strong{font-size:13px;color:#ece5f5;font-weight:600}
.suggestion small{color:#9c93aa;font-size:11px}
.composer-wrap{max-width:900px;padding-bottom:16px}
.composer{background:linear-gradient(135deg,#2b2732,#25232b);border:1px solid #d8c2ff1a;border-radius:25px;box-shadow:0 14px 40px #0003,inset 0 1px #ffffff07}
.composer:focus-within{border-color:#c5a5ff69;box-shadow:0 14px 40px #0003,0 0 0 4px #c5a5ff0d}
.composer textarea::placeholder{color:#a49aae}
.smallbtn:hover{background:#c5a5ff14;color:#f3eaff}
.model-select{color:#d6cbe5}
.sendbtn{background:linear-gradient(140deg,#d9c2ff,#b8baff);color:#271c38;box-shadow:0 4px 15px #a78bea26}
.sendbtn:not(:disabled):hover{background:linear-gradient(140deg,#eadcff,#cccaff)}
.notice{color:#81778d}
.user-message{background:linear-gradient(135deg,#332c40,#2c2737);border-color:#d6b9ff10}
.assistant-label{color:#cdb6ef}
.assistant-message a{color:#d1b4ff}
.assistant-message pre{background:#19161f;border-color:#e1c7ff14}
.message-action:hover{background:#caaaff11;color:#ede2ff}
.modal-backdrop{background:#09070ed9;backdrop-filter:blur(10px)}
.modal{position:relative;background:linear-gradient(145deg,#2c2832,#242129 68%);border-color:#eadbff1c;border-radius:26px;box-shadow:0 28px 100px #000b,0 0 0 1px #ffffff03,inset 0 1px #ffffff08}
.modal:before{content:"";display:block;width:44px;height:4px;border-radius:9px;background:linear-gradient(90deg,#bba2ff,#efb5ee);margin-bottom:18px;opacity:.95}
.modal h2{font-size:23px;letter-spacing:-.7px;color:#f6efff}
.modal p{color:#b4abba}
.field label{color:#e0d6e9}
.field-input-row{display:flex;gap:8px;align-items:center}
.field-input-row input{flex:1;min-width:0}
.field-eye{flex-shrink:0;border:1px solid #ffffff13;background:#332e3b;color:#cfc3dd;border-radius:11px;height:43px;padding:0 12px;font-size:12px;font-weight:600}
.field-eye:hover{background:#3c3448;color:#fff}
.field input{background:#1b1820;border-color:#4a4253;border-radius:13px;padding:13px 12px}
.field input:focus{border-color:#c3a1ff80;box-shadow:0 0 0 3px #c3a1ff12}
.field-help{color:#a79bad}
.field-help a{color:#d4b8ff;text-decoration:underline;text-underline-offset:3px}
.action{background:#393440}
.action:hover{background:#494052}
.action.primary{background:linear-gradient(135deg,#d4baff,#b9bdff);color:#281e38}
.user-menu{background:#292430;border-color:#ffffff15;box-shadow:0 16px 50px #0008}
.user-menu button:hover{background:#ffffff0b}
@media(max-width:900px){.welcome{max-width:700px}}
@media(max-width:640px){.brand{padding-bottom:19px}.brand-copy strong{font-size:14px}.welcome h1{font-size:clamp(32px,8.4vw,43px);letter-spacing:-1.4px}.welcome-subtitle{font-size:13px}.suggestion{min-height:105px;padding:13px}.suggestion-icon{width:27px;height:27px}.composer{border-radius:22px}.modal:before{margin-bottom:14px}}
@media(max-width:360px){.brand-copy small{display:none}}
